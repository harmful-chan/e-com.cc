services:
  caddy:
    image: caddy:latest
    container_name: caddy
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./cert:/etc/caddy/cert
      - ${STORAGE}/caddy/data:/data
      - ${STORAGE}/caddy/config:/config
    restart: always
